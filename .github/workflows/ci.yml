name: CI

on:
  push:
    branches: [ main, vibe/** ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install sbt
      run: |
        # Install sbt using coursier
        curl -fLo cs https://git.io/coursier-cli-linux
        chmod +x cs
        ./cs install sbt:1.9.9
        echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH
    
    - name: Cache sbt
      uses: actions/cache@v3
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
    
    - name: Compile server
      run: sbt server/compile
      working-directory: .
    
    - name: Compile app
      run: sbt app/compile
      working-directory: .
    
    - name: Compile common
      run: sbt "project commonJVM" compile
      working-directory: .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install sbt
      run: |
        # Install sbt using coursier
        curl -fLo cs https://git.io/coursier-cli-linux
        chmod +x cs
        ./cs install sbt:1.9.9
        echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH
    
    - name: Cache sbt
      uses: actions/cache@v3
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
    
    - name: Run server tests
      run: sbt server/test
      working-directory: .
      env:
        TZ: Europe/Kyiv
